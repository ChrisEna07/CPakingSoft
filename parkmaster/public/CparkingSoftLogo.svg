<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="pGrad" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stopColor="#1E3A8A" />
      <stop offset="1" stopColor="#0F172A" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="28" y1="16" x2="42" y2="34" gradientUnits="userSpaceOnUse">
      <stop stopColor="#F59E0B" />
      <stop offset="1" stopColor="#D97706" />
    </linearGradient>
  </defs>

  <!-- Isotipo: Escudo / Cuadro redondeado moderno -->
  <rect x="4" y="4" width="52" height="52" rx="14" fill="url(#pGrad)" />
  <rect x="5" y="5" width="50" height="50" rx="13" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Letra 'P' estilizada -->
  <path d="M20 42V18H33C38.5228 18 43 22.4772 43 28C43 33.5228 38.5228 38 33 38H27V42H20Z" fill="#FFFFFF" />
  
  <!-- Núcleo tecnológico / Perno dorado -->
  <circle cx="33" cy="28" r="4.5" fill="url(#amberGrad)" />
  
  <!-- Detalle sutil de engranaje/candado superior -->
  <path d="M30 14H36" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" />

  <!-- Tipografía: CParking -->
  <text x="68" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" fill="#1E3A8A" letter-spacing="-0.5">CParking</text>
  
  <!-- Tipografía: Soft -->
  <text x="176" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" fill="#D97706" letter-spacing="-0.5">Soft</text>

  <!-- Subtítulo institucional -->
  <text x="70" y="47" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7.5" fill="#64748B" letter-spacing="1.8">SISTEMA INTEGRAL DE CONTROL</text>
</svg>
