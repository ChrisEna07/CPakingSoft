<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Parque Fabricato | Sistema de Control de Parqueadero</title>
<!-- Librerías locales (carpeta vendor/): la app funciona 100% sin internet -->
<script src="vendor/tailwind.js"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    slate2: { 700:'#334155', 800:'#1e293b', 900:'#0f172a', 950:'#0a1120' }
  } } } };
</script>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script>window.react = window.React; /* lucide-react UMD espera global.react */</script>
<script src="vendor/lucide.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/babel.js"></script>
<style>
  body { background:#e9edf3; }
  .qr svg { width:100%; height:100%; display:block; }
  @keyframes slidein { from{transform:translateX(30px);opacity:0} to{transform:none;opacity:1} }
  .toast { animation: slidein .2s ease-out; }
  @keyframes pop { from{transform:scale(.94);opacity:0} to{transform:none;opacity:1} }
  .pop { animation: pop .2s ease-out; }
  @keyframes scan { 0%{top:0} 50%{top:calc(100% - 2px)} 100%{top:0} }
  .scanline { animation: scan 1s linear infinite; }

  /* ---------- IMPRESIÓN TÉRMICA ---------- */
  #print-area { display:none; }
  .thermal { font-family:'Courier New', monospace; color:#000; background:#fff; margin:0 auto; padding:2mm 1mm; font-size:11px; line-height:1.25; }
  .thermal .c { text-align:center; }
  .thermal .b { font-weight:bold; }
  .thermal .row { display:flex; justify-content:space-between; gap:6px; }
  .thermal hr { border:0; border-top:1px dashed #000; margin:5px 0; }
  .thermal .plate { font-size:30px; font-weight:900; letter-spacing:2px; text-align:center; border:2px solid #000; padding:2px 0; margin:4px 0; }
  .thermal .code { font-size:20px; font-weight:900; text-align:center; }
  .thermal .small { font-size:9px; }
  @media print {
    html, body { background:#fff !important; }
    #app-root, #toasts { display:none !important; }
    #print-area { display:block !important; }
    .thermal-wrap { box-shadow:none !important; border:0 !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const {
  Bike, Car, Printer, Download, Upload, Lock, Unlock, Settings, Receipt, Calculator, Clock, Ticket, Banknote,
  Landmark, Search, X, CheckCircle2, AlertTriangle, Info, XCircle, LogOut, LogIn, Wallet, FileText,
  Trash2, Camera, Cloud, WifiOff, ShieldCheck, Eye, Save, Users, Activity
} = window.LucideReact;

// =====================================================================
//  ESQUEMAS Y PERSISTENCIA (localStorage, offline-first)
// =====================================================================
const KEYS = { vehicles: 'vehicles_in_parking', history: 'parking_history', shifts: 'cash_shifts', config: 'parking_config', counters: 'parking_counters' };

const DEFAULT_CONFIG = {
  establishment_name: 'Centro Comercial Parque Fabricato - Bello',
  rate_moto: 1500,
  rate_carro: 3500,
  grace_minutes: 15,
  billing_mode: 'hora',          // 'hora' = hora o fracción iniciada | 'media' = bloques de 30 min a mitad de tarifa
  cap_moto: 150,
  cap_carro: 400,
  cashier_name: 'Taquillero 1',
  paper_width: 80,               // 58 | 80 (mm)
  autoprint_ticket: true,
  autoprint_receipt: false,
  blind_mode: true,              // oculta recaudo e historial hasta ingresar PIN de supervisor
  supervisor_pin: '1234',
  terms: 'Conserve este tiquete: es indispensable para retirar su vehículo.\nPérdida del tiquete: debe presentar documento y tarjeta de propiedad; se cobra el tiempo completo.\nLa administración no responde por objetos dejados en el vehículo.',
};

function readLS(key, def) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return def;
    const p = JSON.parse(raw);
    if (def && !Array.isArray(def) && typeof def === 'object') return { ...def, ...(p || {}) };
    if (Array.isArray(def)) return Array.isArray(p) ? p : def;
    return p;
  } catch (e) { return def; }
}
function useLS(key, def) {
  const [v, setV] = useState(() => readLS(key, def));
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(v)); }
    catch (e) { alert('No se pudo guardar en el almacenamiento local (¿lleno o bloqueado?). Exporte un respaldo y libere espacio.'); }
  }, [key, v]);
  return [v, setV];
}

// =====================================================================
//  UTILIDADES
// =====================================================================
const money = n => '$' + Math.round(n || 0).toLocaleString('es-CO');
const pad = (n, l = 2) => String(n).padStart(l, '0');
const dkey = d => { const x = new Date(d); return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); };
const fmtDate = d => { const x = new Date(d); return pad(x.getDate()) + '/' + pad(x.getMonth() + 1) + '/' + x.getFullYear(); };
const fmtTime = d => { const x = new Date(d); return pad(x.getHours()) + ':' + pad(x.getMinutes()) + ':' + pad(x.getSeconds()); };
const fmtDT = d => fmtDate(d) + ' ' + fmtTime(d);
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const durText = min => {
  const m = Math.max(0, Math.floor(min)), h = Math.floor(m / 60), r = m % 60;
  const parts = [];
  if (h) parts.push(h + (h === 1 ? ' hora' : ' horas'));
  if (r || !h) parts.push(r + (r === 1 ? ' minuto' : ' minutos'));
  return parts.join(' ');
};
const typeLabel = t => (t === 'moto' ? 'Moto' : 'Carro');

function validPlate(p, type) {
  if (type === 'moto') return /^[A-Z]{3}\d{2}[A-Z]?$/.test(p);   // ABC12D (actual) o ABC12 (anterior)
  return /^[A-Z]{3}\d{3}$/.test(p);                               // ABC123
}

// Algoritmo de liquidación
function liquidate(entryISO, type, cfg, nowMs) {
  const minutes = Math.max(0, (nowMs - new Date(entryISO).getTime()) / 60000);
  const rate = Number(cfg['rate_' + type]) || 0;
  const base = { minutes, total_minutes: Math.floor(minutes), rate };
  if (minutes <= cfg.grace_minutes) return { ...base, free: true, billed: 0, units: 0, amount: 0 };
  if (cfg.billing_mode === 'media') {
    const blocks = Math.ceil(minutes / 30);
    return { ...base, free: false, units: blocks, unit_label: 'bloques de 30 min', billed: blocks * 30, amount: Math.round((blocks * rate / 2) / 50) * 50 };
  }
  const hours = Math.ceil(minutes / 60);
  return { ...base, free: false, units: hours, unit_label: hours === 1 ? 'hora' : 'horas', billed: hours * 60, amount: hours * rate };
}

function statsFor(shiftId, history) {
  const s = { total: 0, cash: 0, transfer: 0, moto: 0, carro: 0, count: 0 };
  history.forEach(h => {
    if (h.shift_id !== shiftId) return;
    s.count++; s.total += h.total_amount;
    if (h.payment_method === 'transferencia') s.transfer += h.total_amount; else s.cash += h.total_amount;
    s[h.vehicle_type] += h.total_amount;
  });
  return s;
}

function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

// =====================================================================
//  COMPONENTES BASE
// =====================================================================
function QR({ data, size }) {
  const html = useMemo(() => {
    try { const q = qrcode(0, 'M'); q.addData(data); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
    catch (e) { return '<div style="font-size:9px">QR no disponible</div>'; }
  }, [data]);
  return <div className="qr" style={{ width: size, height: size }} dangerouslySetInnerHTML={{ __html: html }} />;
}

function Toasts({ list, close }) {
  const st = { ok: ['bg-emerald-600', CheckCircle2], warn: ['bg-amber-500', AlertTriangle], err: ['bg-red-600', XCircle], info: ['bg-indigo-600', Info] };
  return (
    <div id="toasts" className="fixed top-4 right-4 z-50 space-y-2 w-[min(92vw,22rem)]">
      {list.map(t => { const [c, Ic] = st[t.kind] || st.info; return (
        <div key={t.id} className={`toast ${c} text-white rounded-lg shadow-xl px-4 py-3 flex items-start gap-3`}>
          <Ic size={20} className="shrink-0 mt-0.5" /><div className="flex-1 text-sm">{t.msg}</div>
          <button onClick={() => close(t.id)}><X size={16} /></button>
        </div>); })}
    </div>
  );
}

const Card = ({ children, className = '' }) => <div className={`bg-white rounded-xl shadow-sm border border-slate-200 ${className}`}>{children}</div>;
const Btn = ({ children, className = '', ...p }) => <button {...p} className={`inline-flex items-center justify-center gap-2 font-semibold rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed ${className}`}>{children}</button>;

function MoneyInput({ value, onChange, className = '', ...rest }) {
  return <input {...rest} inputMode="numeric" value={value === '' ? '' : Number(value).toLocaleString('es-CO')}
    onChange={e => onChange(e.target.value.replace(/\D/g, '').slice(0, 9))} className={className} />;
}

// =====================================================================
//  DOCUMENTOS DE IMPRESIÓN (58 / 80 mm)
// =====================================================================
function ThermalDoc({ doc, cfg }) {
  const w = cfg.paper_width === 58 ? '52mm' : '72mm';
  const qrSize = cfg.paper_width === 58 ? 110 : 140;
  const wrap = (children) => <div className="thermal" style={{ width: w }}>{children}</div>;
  if (!doc) return null;

  if (doc.kind === 'ticket') {
    const v = doc.data;
    return wrap(<>
      <div className="c b" style={{ fontSize: 13 }}>PARQUE FABRICATO</div>
      <div className="c small">{cfg.establishment_name}</div>
      <hr />
      <div className="c b">TIQUETE DE PARQUEO</div>
      <div className="code">#{v.ticket_code}</div>
      <div className="plate">{v.plate}</div>
      <div className="row"><span>Vehículo</span><b>{typeLabel(v.vehicle_type).toUpperCase()}</b></div>
      <div className="row"><span>Fecha</span><b>{fmtDate(v.entry_time)}</b></div>
      <div className="row"><span>Hora</span><b>{fmtTime(v.entry_time)}</b></div>
      <div className="row"><span>Tarifa</span><b>{money(cfg['rate_' + v.vehicle_type])}/h</b></div>
      <div className="row"><span>Gracia</span><b>{cfg.grace_minutes} min</b></div>
      <div style={{ display: 'flex', justifyContent: 'center', margin: '6px 0' }}><QR data={v.barcode_qr_data} size={qrSize} /></div>
      <div className="c small">{v.barcode_qr_data}</div>
      <hr />
      {cfg.terms.split('\n').filter(Boolean).map((l, i) => <div key={i} className="small">* {l}</div>)}
      <div className="c small" style={{ marginTop: 4 }}>Cobro: {cfg.billing_mode === 'media' ? 'bloques de 30 min' : 'hora o fracción iniciada'} (pasada la gracia)</div>
    </>);
  }
  if (doc.kind === 'receipt') {
    const h = doc.data;
    return wrap(<>
      <div className="c b" style={{ fontSize: 13 }}>PARQUE FABRICATO</div>
      <div className="c small">{cfg.establishment_name}</div>
      <hr />
      <div className="c b">RECIBO DE PAGO</div>
      <div className="code">#{h.ticket_code}</div>
      <div className="plate">{h.plate}</div>
      <div className="row"><span>Entrada</span><b>{fmtDT(h.entry_time)}</b></div>
      <div className="row"><span>Salida</span><b>{fmtDT(h.exit_time)}</b></div>
      <div className="row"><span>Tiempo</span><b>{durText(h.total_minutes)}</b></div>
      <div className="row"><span>Min. cobrados</span><b>{h.minutes_billed}</b></div>
      <div className="row"><span>Tarifa/h</span><b>{money(h.rate_applied)}</b></div>
      <hr />
      <div className="row b" style={{ fontSize: 15 }}><span>TOTAL</span><span>{money(h.total_amount)} COP</span></div>
      <div className="row"><span>Pago</span><b>{h.payment_method}</b></div>
      <div className="row"><span>Cajero</span><b>{h.cashier_name}</b></div>
      <hr />
      <div className="c small">Gracias por su visita</div>
    </>);
  }
  if (doc.kind === 'arqueo') {
    const s = doc.data;
    const verdict = s.difference === 0 ? 'CAJA CUADRADA EXACTA' : s.difference < 0 ? 'FALTANTE DE DINERO' : 'SOBRANTE DE DINERO';
    return wrap(<>
      <div className="c b" style={{ fontSize: 13 }}>PARQUE FABRICATO</div>
      <div className="c small">{cfg.establishment_name}</div>
      <hr />
      <div className="c b">COMPROBANTE DE ARQUEO</div>
      <div className="c small">{s.shift_id}</div>
      <hr />
      <div className="row"><span>Cajero</span><b>{s.cashier_name || '-'}</b></div>
      <div className="row"><span>Apertura</span><b>{fmtDT(s.open_time)}</b></div>
      <div className="row"><span>Cierre</span><b>{fmtDT(s.close_time)}</b></div>
      <hr />
      <div className="row"><span>Base inicial</span><b>{money(s.initial_cash)}</b></div>
      <div className="row"><span>Cobros efectivo</span><b>{money(s.cash_collected)}</b></div>
      <div className="row"><span>Cobros transfer.</span><b>{money(s.transfer_collected)}</b></div>
      <div className="row"><span>Total recaudado</span><b>{money(s.total_collected_system)}</b></div>
      <div className="row"><span>Motos / Carros</span><b>{money(s.moto_collected)} / {money(s.carro_collected)}</b></div>
      <hr />
      <div className="row"><span>Efectivo esperado</span><b>{money(s.expected_cash)}</b></div>
      <div className="row"><span>Efectivo reportado</span><b>{money(s.cash_reported_by_user)}</b></div>
      <div className="row b" style={{ fontSize: 13 }}><span>Diferencia</span><span>{s.difference > 0 ? '+' : ''}{money(s.difference)}</span></div>
      <div className="c b" style={{ margin: '6px 0', border: '2px solid #000', padding: 3 }}>{verdict}</div>
      <div style={{ marginTop: 22 }} className="small">Firma cajero: ______________________</div>
      <div style={{ marginTop: 22 }} className="small">Firma supervisor: ____________________</div>
    </>);
  }
  return null;
}

function PrintArea({ doc, cfg }) {
  return (
    <div id="print-area">
      <style>{`@page { size: ${cfg.paper_width}mm auto; margin: 0; }`}</style>
      <ThermalDoc doc={doc} cfg={cfg} />
    </div>
  );
}

// =====================================================================
//  PIN SUPERVISOR
// =====================================================================
function PinGate({ unlocked, tryUnlock, children, title }) {
  const [pin, setPin] = useState('');
  if (unlocked) return children;
  return (
    <Card className="p-6 max-w-sm mx-auto text-center">
      <Lock className="mx-auto text-indigo-600 mb-2" size={32} />
      <div className="font-bold text-slate-800">{title || 'Área de supervisor'}</div>
      <p className="text-sm text-slate-500 mb-3">Ingrese el PIN de supervisor para continuar.</p>
      <form onSubmit={e => { e.preventDefault(); if (!tryUnlock(pin)) setPin(''); }}>
        <input type="password" autoFocus value={pin} onChange={e => setPin(e.target.value)} placeholder="PIN"
          className="w-full text-center text-2xl tracking-widest border-2 border-slate-300 rounded-lg py-2 mb-3 focus:outline-none focus:border-indigo-500" />
        <Btn type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5"><Unlock size={18} />Desbloquear</Btn>
      </form>
    </Card>
  );
}

// =====================================================================
//  A. ENTRADA RÁPIDA
// =====================================================================
function Entry({ cfg, vehicles, setVehicles, counters, setCounters, toast, doPrint, occ }) {
  const [type, setType] = useState('moto');
  const [plate, setPlate] = useState('');
  const [notes, setNotes] = useState('');
  const [allowNS, setAllowNS] = useState(false);
  const [dup, setDup] = useState(null);
  const [scanning, setScanning] = useState(false);
  const [last, setLast] = useState(null);
  const ref = useRef(null);
  const plateRef = useRef('');
  plateRef.current = plate;

  useEffect(() => { ref.current && ref.current.focus(); }, []);
  useEffect(() => {
    const onKey = e => {
      if (e.key === 'F1') { e.preventDefault(); setType('moto'); return; }
      if (e.key === 'F2') { e.preventDefault(); setType('carro'); return; }
      if ((e.key === '1' || e.key === '2') && !e.ctrlKey && !e.altKey && !e.metaKey) {
        const el = document.activeElement;
        const other = el && ['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName) && el !== ref.current;
        if (other) return;
        if (plateRef.current === '') { e.preventDefault(); setType(e.key === '1' ? 'moto' : 'carro'); }  // una placa nunca inicia con número
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const refocus = () => setTimeout(() => { const a = document.activeElement; if (!a || a === document.body) ref.current && ref.current.focus(); }, 40);
  const ok = plate.length > 0 && validPlate(plate, type);
  const free = cfg['cap_' + type] - occ[type];

  const submit = () => {
    if (!plate) { toast('Digite la placa del vehículo', 'warn'); ref.current.focus(); return; }
    if (!allowNS && !validPlate(plate, type)) { toast(`Formato inválido para ${typeLabel(type).toLowerCase()} (${type === 'moto' ? 'ABC12D' : 'ABC123'}). Marque "Placa no estándar" si aplica.`, 'warn'); return; }
    const inside = vehicles.find(v => v.plate === plate);
    if (inside) { setDup(inside); toast(`¡${plate} ya está DENTRO del parqueadero! (${inside.ticket_code})`, 'err'); return; }
    if (free <= 0) { toast(`Sin cupos disponibles para ${typeLabel(type).toLowerCase()}s`, 'err'); return; }
    const n = (counters[type] || 0) + 1;
    const code = (type === 'moto' ? 'MTO' : 'CAR') + '-' + pad(n, 4);
    const entry = new Date().toISOString();
    const v = { id: uid(), ticket_code: code, plate, vehicle_type: type, entry_time: entry, status: 'dentro', barcode_qr_data: `PF|${code}|${plate}|${entry}`, notes: notes.trim() };
    setCounters(c => ({ ...c, [type]: n }));
    setVehicles(list => [...list, v]);
    setLast(v); setDup(null); setPlate(''); setNotes(''); setAllowNS(false);
    toast(`Ingreso registrado: ${plate} · #${code}`, 'ok');
    if (cfg.autoprint_ticket) doPrint({ kind: 'ticket', data: v });
    ref.current.focus();
  };

  const simulate = () => {
    if (scanning) return;
    setScanning(true); setDup(null);
    setTimeout(() => {
      const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ', r = s => s[Math.floor(Math.random() * s.length)], d = () => Math.floor(Math.random() * 10);
      let p, guard = 0;
      do { p = type === 'moto' ? r(A) + r(A) + r(A) + d() + d() + r(A) : r(A) + r(A) + r(A) + d() + d() + d(); guard++; }
      while (vehicles.some(v => v.plate === p) && guard < 20);
      setPlate(p); setScanning(false);
      toast(`LPR (simulado) detectó ${p} · confianza ${(94 + Math.random() * 5.5).toFixed(1)}%`, 'info');
      ref.current && ref.current.focus();
    }, 1000);
  };

  return (
    <div className="grid lg:grid-cols-2 gap-5">
      <Card className="p-5">
        <div className="grid grid-cols-2 gap-3 mb-4">
          {[['moto', 'Moto', Bike, '1 / F1'], ['carro', 'Carro', Car, '2 / F2']].map(([k, l, Ic, key]) => (
            <button key={k} onClick={() => { setType(k); ref.current.focus(); }}
              className={`rounded-xl border-2 p-3 flex flex-col items-center transition ${type === k ? 'border-emerald-500 bg-emerald-50 text-slate-900' : 'border-slate-200 text-slate-500 hover:border-slate-400'}`}>
              <Ic size={30} /><div className="font-bold">{l} <span className="font-normal text-slate-500">{money(cfg['rate_' + k])}/h</span></div>
              <div className="text-[11px] text-slate-400">Atajo: tecla {key}</div>
              <div className={`text-xs font-semibold mt-1 ${cfg['cap_' + k] - occ[k] <= 5 ? 'text-red-600' : 'text-emerald-600'}`}>{cfg['cap_' + k] - occ[k]} cupos libres</div>
            </button>
          ))}
        </div>

        <label className="text-xs font-semibold uppercase tracking-wide text-slate-500">Placa (sin espacios ni guiones)</label>
        <input ref={ref} value={plate} onBlur={refocus} autoComplete="off" spellCheck={false}
          onChange={e => { setPlate(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7)); setDup(null); }}
          onKeyDown={e => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') { setPlate(''); setDup(null); } }}
          placeholder={type === 'moto' ? 'ABC12D' : 'ABC123'}
          className={`w-full mt-1 text-center text-5xl font-black font-mono tracking-widest uppercase rounded-xl border-4 py-4 bg-amber-50 focus:outline-none focus:ring-4 focus:ring-emerald-300 ${plate && !ok && !allowNS ? 'border-amber-500' : 'border-slate-800'}`} />
        <div className="h-5 text-xs mt-1 text-center">
          {plate && (ok ? <span className="text-emerald-600 font-semibold">✓ Formato válido</span>
            : <span className="text-amber-600 font-semibold">Formato esperado: {type === 'moto' ? 'ABC12D (o ABC12)' : 'ABC123'}</span>)}
        </div>
        <div className="flex items-center justify-between gap-3 my-2 text-sm">
          <label className="flex items-center gap-2 text-slate-600"><input type="checkbox" checked={allowNS} onChange={e => setAllowNS(e.target.checked)} />Placa no estándar</label>
          <input value={notes} onChange={e => setNotes(e.target.value)} placeholder="Notas (opcional: casco, color…)" className="flex-1 border border-slate-300 rounded-lg px-3 py-1.5 text-sm" />
        </div>

        {dup && (
          <div className="pop my-3 bg-red-50 border-2 border-red-500 text-red-800 rounded-lg p-3 text-sm">
            <b className="flex items-center gap-2"><AlertTriangle size={18} />Placa duplicada — ingreso bloqueado</b>
            {dup.plate} ya está dentro desde {fmtDT(dup.entry_time)} (tiquete #{dup.ticket_code}). Verifique la placa o registre primero su salida.
          </div>
        )}

        <Btn onClick={submit} className="w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white py-4 text-lg shadow"><Printer size={22} />Ingresar e Imprimir Tiquete</Btn>
        <Btn onClick={simulate} disabled={scanning} className="w-full mt-3 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5"><Camera size={18} />{scanning ? 'Leyendo cámara…' : 'Simular Cámara LPR'}</Btn>
        <div className="text-[11px] text-slate-400 mt-2 text-center">Enter = ingresar · Esc = limpiar · con la placa vacía, las teclas 1/2 cambian el tipo</div>
      </Card>

      <div className="space-y-4">
        <Card className="overflow-hidden">
          <div className="bg-slate-900 text-slate-300 text-xs px-3 py-2 flex justify-between"><span className="flex items-center gap-2"><Camera size={14} />CAM LPR · Acceso (simulación)</span><span className="text-red-400">● REC</span></div>
          <div className="relative h-36 bg-gradient-to-b from-slate-700 to-slate-900 grid place-items-center overflow-hidden">
            {scanning && <div className="absolute inset-x-0 h-0.5 bg-emerald-400 shadow-[0_0_12px_#34d399] scanline" />}
            {plate ? (
              <div className={`border-2 rounded px-2 py-1 ${scanning ? 'border-slate-400' : 'border-emerald-400 bg-emerald-400/10'}`}>
                <div className="font-mono font-black text-black bg-amber-300 px-4 rounded text-xl">{plate}</div>
              </div>
            ) : <div className="text-slate-500 text-sm">{scanning ? 'Analizando imagen…' : 'Sin placa detectada'}</div>}
          </div>
        </Card>

        {last ? (
          <Card className="p-4 pop">
            <div className="flex items-center justify-between mb-3">
              <div className="font-bold text-slate-800 flex items-center gap-2"><Ticket size={18} />Último tiquete emitido</div>
              <Btn onClick={() => doPrint({ kind: 'ticket', data: last })} className="bg-slate-800 text-white text-sm px-3 py-1.5"><Printer size={16} />Reimprimir</Btn>
            </div>
            <div className="bg-slate-100 p-3 rounded-lg overflow-auto"><div className="thermal-wrap shadow border bg-white mx-auto" style={{ width: cfg.paper_width === 58 ? '52mm' : '72mm' }}><ThermalDoc doc={{ kind: 'ticket', data: last }} cfg={cfg} /></div></div>
          </Card>
        ) : <Card className="p-8 text-center text-slate-400 text-sm"><Ticket className="mx-auto mb-2" size={32} />La vista previa del tiquete aparecerá aquí</Card>}
      </div>
    </div>
  );
}

// =====================================================================
//  B. SALIDA, COBRO Y LIQUIDACIÓN
// =====================================================================
function Exit({ cfg, vehicles, setVehicles, setHistory, shift, toast, doPrint, goTab }) {
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(null);
  const [method, setMethod] = useState('efectivo');
  const [given, setGiven] = useState('');
  const [verified, setVerified] = useState(false);
  const [done, setDone] = useState(null);
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const i = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(i); }, []);

  const norm = s => s.toUpperCase().replace(/[^A-Z0-9|]/g, '');
  const term = useMemo(() => {
    let t = q.trim();
    if (t.toUpperCase().startsWith('PF|')) t = t.split('|')[1] || '';   // lectura de QR del tiquete
    return norm(t).replace('|', '');
  }, [q]);
  const list = useMemo(() => vehicles
    .filter(v => !term || v.plate.includes(term) || v.ticket_code.replace('-', '').includes(term.replace('-', '')))
    .sort((a, b) => new Date(a.entry_time) - new Date(b.entry_time)), [vehicles, term]);

  const v = vehicles.find(x => x.id === sel);
  const liq = v ? liquidate(v.entry_time, v.vehicle_type, cfg, now) : null;
  const choose = id => { setSel(id); setGiven(''); setVerified(false); setMethod('efectivo'); setDone(null); };
  const change = given === '' ? null : Number(given) - (liq ? liq.amount : 0);

  const pay = () => {
    if (!v) return;
    const t = Date.now();
    const L = liquidate(v.entry_time, v.vehicle_type, cfg, t);
    if (L.amount > 0 && !shift) { toast('Debe abrir un turno de caja antes de cobrar', 'err'); goTab('turno'); return; }
    if (L.amount > 0 && method === 'efectivo' && given !== '' && Number(given) < L.amount) { toast('El efectivo recibido es menor al total', 'err'); return; }
    if (L.amount > 0 && method === 'transferencia' && !verified) { toast('Confirme que la transferencia fue verificada', 'warn'); return; }
    const rec = {
      id: uid(), ticket_code: v.ticket_code, plate: v.plate, vehicle_type: v.vehicle_type, entry_time: v.entry_time,
      exit_time: new Date(t).toISOString(), total_minutes: L.total_minutes, minutes_billed: L.billed, rate_applied: L.rate,
      total_amount: L.amount, payment_method: L.amount > 0 ? method : 'efectivo', cashier_name: cfg.cashier_name,
      timestamp: new Date(t).toISOString(), shift_id: shift ? shift.shift_id : null, notes: v.notes || '',
    };
    setHistory(h => [...h, rec]);
    setVehicles(list => list.filter(x => x.id !== v.id));
    setDone(rec); setSel(null); setQ(''); setGiven('');
    toast(L.amount ? `Salida ${v.plate}: ${money(L.amount)} COP (${rec.payment_method})` : `Salida ${v.plate}: período de gracia, sin cobro`, 'ok');
    if (cfg.autoprint_receipt) doPrint({ kind: 'receipt', data: rec });
  };

  return (
    <div className="grid lg:grid-cols-5 gap-5">
      <div className="lg:col-span-3 space-y-3">
        <Card className="p-3 flex gap-2">
          <div className="relative flex-1">
            <Search size={18} className="absolute left-3 top-3 text-slate-400" />
            <input autoFocus value={q} onChange={e => setQ(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && list.length === 1) choose(list[0].id); }}
              placeholder="Placa, código de tiquete o escanee el QR…" className="w-full pl-10 pr-3 py-2.5 rounded-lg border border-slate-300 uppercase focus:outline-none focus:ring-2 focus:ring-emerald-400" />
          </div>
          {q && <Btn onClick={() => setQ('')} className="bg-slate-200 px-3"><X size={16} /></Btn>}
        </Card>
        <div className="text-xs text-slate-500 px-1">{list.length} vehículo(s) en patio · ordenados por mayor permanencia</div>
        <div className="space-y-2 max-h-[65vh] overflow-auto pr-1">
          {list.length === 0 && <Card className="p-8 text-center text-slate-400">No hay vehículos que coincidan.</Card>}
          {list.map(x => {
            const k = liquidate(x.entry_time, x.vehicle_type, cfg, now);
            return (
              <button key={x.id} onClick={() => choose(x.id)} className={`w-full text-left bg-white rounded-xl border-2 p-3 flex items-center gap-3 hover:shadow ${sel === x.id ? 'border-emerald-500' : 'border-slate-200'}`}>
                <div className="p-2 rounded-lg bg-indigo-50 text-indigo-700">{x.vehicle_type === 'moto' ? <Bike /> : <Car />}</div>
                <div className="flex-1 min-w-0">
                  <div className="font-mono font-black text-lg text-slate-900">{x.plate}</div>
                  <div className="text-xs text-slate-500">#{x.ticket_code} · Entró {fmtDT(x.entry_time)}</div>
                </div>
                <div className="text-right">
                  <div className="text-sm font-semibold text-slate-700">{durText(k.total_minutes)}</div>
                  <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${k.free ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>{k.free ? 'Gracia · $0' : money(k.amount)}</span>
                </div>
              </button>
            );
          })}
        </div>
      </div>

      <div className="lg:col-span-2 space-y-3">
        <Card className="p-5 lg:sticky lg:top-4">
          <div className="flex items-center gap-2 font-bold text-slate-800 mb-3"><Calculator size={20} />Tarjeta de Cobro</div>
          {!v && !done && <div className="text-center text-slate-400 py-10 text-sm">Seleccione un vehículo para liquidar</div>}
          {!v && done && (
            <div className="pop text-center py-4">
              <CheckCircle2 className="mx-auto text-emerald-500" size={40} />
              <div className="font-bold mt-1">Salida registrada: {done.plate}</div>
              <div className="text-slate-500 text-sm mb-3">{money(done.total_amount)} COP · {done.payment_method}</div>
              <Btn onClick={() => doPrint({ kind: 'receipt', data: done })} className="bg-slate-800 text-white px-4 py-2"><Receipt size={18} />Imprimir recibo</Btn>
            </div>
          )}
          {v && liq && (
            <div className="pop">
              <div className="flex items-center justify-between mb-3"><div className="font-mono font-black text-2xl">{v.plate}</div><span className="text-xs font-bold bg-slate-100 px-2 py-1 rounded uppercase">{v.vehicle_type} · #{v.ticket_code}</span></div>
              <dl className="text-sm space-y-2 border-y border-slate-200 py-3">
                <div className="flex justify-between"><dt className="text-slate-500">Entrada</dt><dd className="font-semibold">{fmtDT(v.entry_time)}</dd></div>
                <div className="flex justify-between"><dt className="text-slate-500">Tiempo total</dt><dd className="font-semibold">{durText(liq.total_minutes)}</dd></div>
                <div className="flex justify-between"><dt className="text-slate-500">Tarifa / hora</dt><dd className="font-semibold">{money(liq.rate)}</dd></div>
                <div className="flex justify-between"><dt className="text-slate-500">Gracia</dt><dd className="font-semibold">{cfg.grace_minutes} min</dd></div>
                {!liq.free && <div className="flex justify-between"><dt className="text-slate-500">Cobrado</dt><dd className="font-semibold">{liq.units} {liq.unit_label}</dd></div>}
                {v.notes && <div className="flex justify-between"><dt className="text-slate-500">Notas</dt><dd className="font-semibold">{v.notes}</dd></div>}
              </dl>
              <div className="py-3 text-right">
                <div className="text-xs text-slate-500">TOTAL A PAGAR</div>
                <div className={`text-4xl font-black ${liq.free ? 'text-emerald-600' : 'text-slate-900'}`}>{money(liq.amount)} <span className="text-base font-semibold">COP</span></div>
                {liq.free && <div className="text-sm font-semibold text-emerald-600">Período de Gracia Gratuito</div>}
              </div>

              {!liq.free && (<>
                <div className="grid grid-cols-2 gap-2 mb-3">
                  {[['efectivo', 'Efectivo', Banknote], ['transferencia', 'Transferencia', Landmark]].map(([k, l, Ic]) => (
                    <button key={k} onClick={() => setMethod(k)} className={`border-2 rounded-lg p-2 flex flex-col items-center text-sm font-semibold ${method === k ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 text-slate-600'}`}><Ic size={20} />{l}</button>
                  ))}
                </div>
                {method === 'efectivo' && (
                  <div className="mb-3 bg-slate-50 rounded-lg p-3">
                    <label className="text-xs font-semibold text-slate-500 uppercase">Paga con</label>
                    <MoneyInput value={given} onChange={setGiven} placeholder="$0" className="w-full text-2xl font-bold border-2 border-slate-300 rounded-lg px-3 py-2 mt-1 focus:outline-none focus:border-emerald-500" />
                    <div className="flex gap-1 mt-2 flex-wrap">
                      {[2000, 5000, 10000, 20000, 50000].map(b => <button key={b} onClick={() => setGiven(String(b))} className="text-xs bg-white border border-slate-300 rounded px-2 py-1 hover:bg-emerald-50">{money(b)}</button>)}
                      <button onClick={() => setGiven(String(liq.amount))} className="text-xs bg-white border border-slate-300 rounded px-2 py-1 hover:bg-emerald-50">Exacto</button>
                    </div>
                    {change !== null && (change >= 0
                      ? <div className="mt-2 text-lg font-black text-emerald-700">Devuelta: {money(change)}</div>
                      : <div className="mt-2 text-lg font-black text-red-600">Faltan: {money(-change)}</div>)}
                  </div>
                )}
                {method === 'transferencia' && (
                  <div className="mb-3 text-center bg-amber-50 border border-amber-200 rounded-lg p-3">
                    <div className="text-xs font-bold text-amber-800 mb-2">QR Bancolombia (simulado) · {money(liq.amount)} COP</div>
                    <div className="inline-block bg-white p-1 border"><QR data={`BANCOLOMBIA-SIMULADO|${v.ticket_code}|${liq.amount}`} size={110} /></div>
                    <label className="flex items-center justify-center gap-2 text-sm mt-2"><input type="checkbox" checked={verified} onChange={e => setVerified(e.target.checked)} />Transferencia verificada en la app del banco</label>
                  </div>
                )}
              </>)}
              {!shift && !liq.free && <div className="text-xs bg-red-50 text-red-700 rounded p-2 mb-2">No hay turno abierto: abra turno para cobrar.</div>}
              <Btn onClick={pay} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 text-lg"><LogOut size={20} />Cobrar y Registrar Salida</Btn>
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

// =====================================================================
//  C. TURNO Y ARQUEO CIEGO
// =====================================================================
function Shift({ cfg, shift, shifts, setShifts, history, vehicles, toast, doPrint }) {
  const [base, setBase] = useState('');
  const [real, setReal] = useState('');
  const [result, setResult] = useState(null);

  const open = () => {
    const now = new Date();
    const s = { shift_id: `T-${dkey(now).replace(/-/g, '')}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`, open_time: now.toISOString(), close_time: null,
      initial_cash: Number(base || 0), total_collected_system: 0, cash_reported_by_user: null, difference: null, status: 'abierto', cashier_name: cfg.cashier_name };
    setShifts(l => [...l, s]); setBase(''); setResult(null);
    toast(`Turno ${s.shift_id} abierto con base ${money(s.initial_cash)}`, 'ok');
  };

  const close = () => {
    if (real === '') { toast('Digite el dinero físico que tiene en mano', 'warn'); return; }
    if (!confirm('¿Cerrar el turno con el valor digitado? Esta acción no se puede deshacer.')) return;
    const st = statsFor(shift.shift_id, history);
    const expected = shift.initial_cash + st.cash;
    const reported = Number(real);
    const closed = { ...shift, close_time: new Date().toISOString(), total_collected_system: st.total, cash_collected: st.cash, transfer_collected: st.transfer,
      moto_collected: st.moto, carro_collected: st.carro, expected_cash: expected, cash_reported_by_user: reported, difference: reported - expected, status: 'cerrado' };
    setShifts(l => l.map(x => x.shift_id === shift.shift_id ? closed : x));
    setResult(closed); setReal('');
    toast(closed.difference === 0 ? 'Turno cerrado: caja cuadrada' : `Turno cerrado con diferencia de ${money(closed.difference)}`, closed.difference === 0 ? 'ok' : 'warn');
  };

  return (
    <div className="grid lg:grid-cols-2 gap-5">
      <Card className="p-5">
        <div className="font-bold text-slate-800 flex items-center gap-2 mb-3"><Wallet size={20} />Control de Turno</div>
        {!shift ? (
          <>
            <p className="text-sm text-slate-500 mb-3">No hay turno abierto. Registre la base de caja inicial para empezar a cobrar.</p>
            <label className="text-xs font-semibold uppercase text-slate-500">Base de caja inicial (COP)</label>
            <MoneyInput value={base} onChange={setBase} placeholder="$0" className="w-full text-3xl font-black border-2 border-slate-800 rounded-xl px-4 py-3 my-2 focus:outline-none focus:ring-4 focus:ring-emerald-300" />
            <div className="text-xs text-slate-500 mb-3">Cajero: <b>{cfg.cashier_name}</b></div>
            <Btn onClick={open} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3"><LogIn size={20} />Abrir Turno</Btn>
          </>
        ) : (
          <>
            <div className="text-sm bg-emerald-50 border border-emerald-200 rounded-lg p-3 mb-4 space-y-1">
              <div className="flex justify-between"><span>Turno</span><b>{shift.shift_id}</b></div>
              <div className="flex justify-between"><span>Abierto</span><b>{fmtDT(shift.open_time)}</b></div>
              <div className="flex justify-between"><span>Base inicial</span><b>{money(shift.initial_cash)}</b></div>
              <div className="flex justify-between"><span>Vehículos dentro</span><b>{vehicles.length}</b></div>
            </div>
            <div className="font-semibold text-slate-800 mb-1 flex items-center gap-2"><Lock size={16} />Cierre ciego</div>
            <p className="text-sm text-slate-500 mb-2">Cuente todo el efectivo físico (incluida la base) y digítelo. El sistema no muestra cuánto debería haber.</p>
            <MoneyInput value={real} onChange={setReal} placeholder="$0" className="w-full text-3xl font-black border-2 border-slate-800 rounded-xl px-4 py-3 mb-3 focus:outline-none focus:ring-4 focus:ring-emerald-300" />
            <Btn onClick={close} className="w-full bg-slate-800 hover:bg-slate-900 text-white py-3"><Lock size={20} />Cerrar Turno</Btn>
          </>
        )}
      </Card>

      <div>
        {result ? (
          <Card className={`p-5 pop border-2 ${result.difference === 0 ? 'border-emerald-500' : result.difference < 0 ? 'border-red-500' : 'border-sky-500'}`}>
            <div className="text-xl font-black flex items-center gap-2 mb-3">
              {result.difference === 0 && <><CheckCircle2 className="text-emerald-600" />✅ Caja Cuadrada Exacta</>}
              {result.difference < 0 && <><AlertTriangle className="text-red-600" />⚠️ Faltante de Dinero: -{money(-result.difference)} COP</>}
              {result.difference > 0 && <><Info className="text-sky-600" />ℹ️ Sobrante de Dinero: +{money(result.difference)} COP</>}
            </div>
            <div className="text-sm space-y-1">
              {[['Base inicial', result.initial_cash], ['Cobros en efectivo', result.cash_collected], ['Cobros por transferencia', result.transfer_collected], ['Total recaudado (sistema)', result.total_collected_system],
                ['Motos', result.moto_collected], ['Carros', result.carro_collected], ['Efectivo esperado', result.expected_cash], ['Efectivo reportado', result.cash_reported_by_user]].map(([l, v]) => (
                <div key={l} className="flex justify-between border-b border-slate-100 py-1"><span className="text-slate-500">{l}</span><b>{money(v)}</b></div>))}
            </div>
            <div className="flex gap-2 mt-4">
              <Btn onClick={() => doPrint({ kind: 'arqueo', data: result })} className="flex-1 bg-slate-800 text-white py-2.5"><Printer size={18} />Imprimir comprobante</Btn>
              <Btn onClick={() => setResult(null)} className="bg-slate-200 px-4">Cerrar</Btn>
            </div>
          </Card>
        ) : (
          <Card className="p-8 text-center text-slate-400 text-sm"><Calculator className="mx-auto mb-2" size={32} />El veredicto del arqueo aparecerá aquí al cerrar el turno.</Card>
        )}
      </div>
    </div>
  );
}

// =====================================================================
//  D. AUDITORÍA, HISTORIAL Y EXPORTACIÓN
// =====================================================================
function Audit({ cfg, vehicles, history, shifts, unlocked, tryUnlock, now, toast, doPrint }) {
  const today = dkey(Date.now());
  const [from, setFrom] = useState(today);
  const [to, setTo] = useState(today);
  const [ft, setFt] = useState('todos');
  const rows = useMemo(() => history.filter(h => {
    const d = dkey(h.exit_time);
    return d >= from && d <= to && (ft === 'todos' || h.vehicle_type === ft);
  }).sort((a, b) => new Date(b.exit_time) - new Date(a.exit_time)), [history, from, to, ft]);
  const total = rows.reduce((s, r) => s + r.total_amount, 0);

  const exportCSV = () => {
    if (!rows.length) { toast('No hay transacciones para exportar con estos filtros', 'warn'); return; }
    const cols = ['id', 'ticket_code', 'plate', 'vehicle_type', 'entry_time', 'exit_time', 'total_minutes', 'minutes_billed', 'rate_applied', 'total_amount', 'payment_method', 'cashier_name', 'timestamp', 'shift_id'];
    const esc = v => { const s = String(v == null ? '' : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const csv = '\uFEFF' + cols.join(';') + '\r\n' + [...rows].reverse().map(r => cols.map(c => esc(r[c])).join(';')).join('\r\n');
    downloadFile(`parque_fabricato_${from}_a_${to}.csv`, csv, 'text/csv;charset=utf-8');
    toast(`CSV exportado: ${rows.length} transacciones`, 'ok');
  };

  const sorted = [...vehicles].sort((a, b) => new Date(a.entry_time) - new Date(b.entry_time));
  return (
    <div className="space-y-5">
      <Card className="p-4">
        <div className="font-bold text-slate-800 flex items-center gap-2 mb-3"><Car size={20} />Vehículos actualmente estacionados ({vehicles.length})</div>
        <div className="overflow-auto max-h-80">
          <table className="w-full text-sm">
            <thead className="sticky top-0 bg-slate-100 text-slate-600 text-left"><tr>{['Tiquete', 'Placa', 'Tipo', 'Entrada', 'Permanencia', 'Notas'].map(h => <th key={h} className="px-3 py-2">{h}</th>)}</tr></thead>
            <tbody>{sorted.map(v => { const m = (now - new Date(v.entry_time).getTime()) / 60000; return (
              <tr key={v.id} className="border-t"><td className="px-3 py-1.5">#{v.ticket_code}</td><td className="px-3 font-mono font-bold">{v.plate}</td><td className="px-3 capitalize">{v.vehicle_type}</td>
                <td className="px-3">{fmtDT(v.entry_time)}</td><td className={`px-3 font-semibold ${m > 240 ? 'text-amber-600' : ''}`}>{durText(m)}</td><td className="px-3 text-slate-500">{v.notes}</td></tr>); })}
              {!sorted.length && <tr><td colSpan="6" className="text-center text-slate-400 py-6">Parqueadero vacío</td></tr>}</tbody>
          </table>
        </div>
      </Card>

      {cfg.blind_mode && !unlocked ? <PinGate unlocked={false} tryUnlock={tryUnlock} title="Historial financiero y exportación (supervisor)" /> : (<>
        <Card className="p-4">
          <div className="flex flex-wrap items-end gap-3 mb-3">
            <div className="font-bold text-slate-800 flex items-center gap-2 mr-auto"><FileText size={20} />Historial de salidas</div>
            <label className="text-xs text-slate-500">Desde<input type="date" value={from} onChange={e => setFrom(e.target.value)} className="block border border-slate-300 rounded px-2 py-1 text-sm text-slate-800" /></label>
            <label className="text-xs text-slate-500">Hasta<input type="date" value={to} onChange={e => setTo(e.target.value)} className="block border border-slate-300 rounded px-2 py-1 text-sm text-slate-800" /></label>
            <label className="text-xs text-slate-500">Tipo<select value={ft} onChange={e => setFt(e.target.value)} className="block border border-slate-300 rounded px-2 py-1 text-sm text-slate-800"><option value="todos">Todos</option><option value="moto">Motos</option><option value="carro">Carros</option></select></label>
            <Btn onClick={exportCSV} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2"><Download size={18} />Exportar a Excel / CSV</Btn>
          </div>
          <div className="text-sm mb-2 text-slate-600">{rows.length} transacciones · Total: <b className="text-slate-900">{money(total)} COP</b></div>
          <div className="overflow-auto max-h-96">
            <table className="w-full text-sm">
              <thead className="sticky top-0 bg-slate-100 text-slate-600 text-left"><tr>{['Tiquete', 'Placa', 'Tipo', 'Entrada', 'Salida', 'Min.', 'Cobrados', 'Total', 'Pago', 'Cajero'].map(h => <th key={h} className="px-3 py-2 whitespace-nowrap">{h}</th>)}</tr></thead>
              <tbody>{rows.slice(0, 400).map(r => (
                <tr key={r.id} className="border-t hover:bg-slate-50 cursor-pointer" onClick={() => doPrint({ kind: 'receipt', data: r })} title="Clic para reimprimir recibo">
                  <td className="px-3 py-1.5">#{r.ticket_code}</td><td className="px-3 font-mono font-bold">{r.plate}</td><td className="px-3 capitalize">{r.vehicle_type}</td>
                  <td className="px-3 whitespace-nowrap">{fmtDT(r.entry_time)}</td><td className="px-3 whitespace-nowrap">{fmtDT(r.exit_time)}</td><td className="px-3">{r.total_minutes}</td><td className="px-3">{r.minutes_billed}</td>
                  <td className="px-3 font-semibold">{money(r.total_amount)}</td><td className="px-3 capitalize">{r.payment_method}</td><td className="px-3">{r.cashier_name}</td></tr>))}
                {!rows.length && <tr><td colSpan="10" className="text-center text-slate-400 py-6">Sin transacciones en el rango</td></tr>}</tbody>
            </table>
          </div>
          {rows.length > 400 && <div className="text-xs text-slate-400 mt-2">Mostrando 400 de {rows.length}; el CSV incluye todas.</div>}
        </Card>

        <Card className="p-4">
          <div className="font-bold text-slate-800 flex items-center gap-2 mb-3"><Wallet size={20} />Turnos y arqueos</div>
          <div className="overflow-auto max-h-72">
            <table className="w-full text-sm">
              <thead className="bg-slate-100 text-slate-600 text-left"><tr>{['Turno', 'Cajero', 'Apertura', 'Cierre', 'Base', 'Recaudado', 'Reportado', 'Diferencia', 'Estado', ''].map(h => <th key={h} className="px-3 py-2 whitespace-nowrap">{h}</th>)}</tr></thead>
              <tbody>{[...shifts].reverse().map(s => (
                <tr key={s.shift_id} className="border-t"><td className="px-3 py-1.5">{s.shift_id}</td><td className="px-3">{s.cashier_name || '-'}</td><td className="px-3 whitespace-nowrap">{fmtDT(s.open_time)}</td><td className="px-3 whitespace-nowrap">{s.close_time ? fmtDT(s.close_time) : '-'}</td>
                  <td className="px-3">{money(s.initial_cash)}</td><td className="px-3">{money(s.status === 'abierto' ? statsFor(s.shift_id, history).total : s.total_collected_system)}</td>
                  <td className="px-3">{s.cash_reported_by_user == null ? '-' : money(s.cash_reported_by_user)}</td>
                  <td className={`px-3 font-bold ${s.difference === 0 ? 'text-emerald-600' : s.difference < 0 ? 'text-red-600' : s.difference > 0 ? 'text-sky-600' : ''}`}>{s.difference == null ? '-' : money(s.difference)}</td>
                  <td className="px-3 capitalize">{s.status}</td>
                  <td className="px-3">{s.status === 'cerrado' && <button className="text-indigo-600 hover:underline" onClick={() => doPrint({ kind: 'arqueo', data: s })}>Imprimir</button>}</td></tr>))}
                {!shifts.length && <tr><td colSpan="10" className="text-center text-slate-400 py-6">Aún no hay turnos</td></tr>}</tbody>
            </table>
          </div>
        </Card>
      </>)}
    </div>
  );
}

// =====================================================================
//  CONFIGURACIÓN (supervisor)
// =====================================================================
function Config({ cfg, setCfg, toast }) {
  const [d, setD] = useState(cfg);
  const [wipe, setWipe] = useState('');
  const set = (k, v) => setD(x => ({ ...x, [k]: v }));
  const num = (k, label, min = 0) => (
    <label className="text-xs text-slate-500">{label}
      <input type="number" min={min} value={d[k]} onChange={e => set(k, e.target.value === '' ? '' : Number(e.target.value))} className="block w-full border border-slate-300 rounded-lg px-3 py-2 text-base text-slate-900" /></label>);

  const save = () => {
    const bad = ['rate_moto', 'rate_carro', 'grace_minutes', 'cap_moto', 'cap_carro'].some(k => d[k] === '' || Number(d[k]) < 0) || !String(d.supervisor_pin).length || String(d.supervisor_pin).length < 4;
    if (bad || !d.establishment_name.trim()) { toast('Revise los valores: no pueden estar vacíos o negativos y el PIN requiere mínimo 4 dígitos', 'err'); return; }
    setCfg({ ...d, supervisor_pin: String(d.supervisor_pin) });
    toast('Configuración guardada', 'ok');
  };

  const backup = () => {
    const obj = {}; Object.values(KEYS).forEach(k => { obj[k] = readLS(k, null); });
    downloadFile(`respaldo_parque_fabricato_${dkey(Date.now())}.json`, JSON.stringify(obj), 'application/json');
    toast('Respaldo descargado', 'ok');
  };
  const restore = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!Array.isArray(o[KEYS.vehicles]) || !Array.isArray(o[KEYS.history])) throw new Error('formato');
        if (!confirm('Esto reemplazará TODOS los datos actuales por los del respaldo. ¿Continuar?')) return;
        Object.values(KEYS).forEach(k => { if (o[k] != null) localStorage.setItem(k, JSON.stringify(o[k])); });
        location.reload();
      } catch (err) { toast('Archivo de respaldo inválido', 'err'); }
    };
    r.readAsText(f); e.target.value = '';
  };
  const wipeAll = () => {
    if (wipe !== 'BORRAR') { toast('Escriba BORRAR para confirmar', 'warn'); return; }
    Object.values(KEYS).forEach(k => localStorage.removeItem(k)); location.reload();
  };

  return (
    <div className="grid lg:grid-cols-2 gap-5">
      <Card className="p-5 space-y-3">
        <div className="font-bold text-slate-800 flex items-center gap-2"><Settings size={20} />Tarifas y reglas</div>
        <label className="text-xs text-slate-500">Nombre del establecimiento<input value={d.establishment_name} onChange={e => set('establishment_name', e.target.value)} className="block w-full border border-slate-300 rounded-lg px-3 py-2 text-base text-slate-900" /></label>
        <div className="grid grid-cols-2 gap-3">{num('rate_moto', 'Valor hora Moto (COP)')}{num('rate_carro', 'Valor hora Carro (COP)')}{num('grace_minutes', 'Minutos de gracia')}
          <label className="text-xs text-slate-500">Cobro por<select value={d.billing_mode} onChange={e => set('billing_mode', e.target.value)} className="block w-full border border-slate-300 rounded-lg px-3 py-2 text-base text-slate-900"><option value="hora">Hora o fracción iniciada</option><option value="media">Bloques de 30 min (media tarifa)</option></select></label>
          {num('cap_moto', 'Capacidad Motos', 1)}{num('cap_carro', 'Capacidad Carros', 1)}</div>
        <div className="grid grid-cols-2 gap-3">
          <label className="text-xs text-slate-500">Nombre del cajero<input value={d.cashier_name} onChange={e => set('cashier_name', e.target.value)} className="block w-full border border-slate-300 rounded-lg px-3 py-2 text-base text-slate-900" /></label>
          <label className="text-xs text-slate-500">Papel térmico<select value={d.paper_width} onChange={e => set('paper_width', Number(e.target.value))} className="block w-full border border-slate-300 rounded-lg px-3 py-2 text-base text-slate-900"><option value={80}>80 mm</option><option value={58}>58 mm</option></select></label>
        </div>
        <label className="text-xs text-slate-500">Condiciones del tiquete (una por línea)<textarea rows={4} value={d.terms} onChange={e => set('terms', e.target.value)} className="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900" /></label>
        <div className="space-y-1 text-sm">
          <label className="flex items-center gap-2"><input type="checkbox" checked={d.autoprint_ticket} onChange={e => set('autoprint_ticket', e.target.checked)} />Imprimir tiquete automáticamente al ingresar</label>
          <label className="flex items-center gap-2"><input type="checkbox" checked={d.autoprint_receipt} onChange={e => set('autoprint_receipt', e.target.checked)} />Imprimir recibo automáticamente al cobrar</label>
          <label className="flex items-center gap-2"><input type="checkbox" checked={d.blind_mode} onChange={e => set('blind_mode', e.target.checked)} />Modo ciego antifraude (oculta recaudo e historial sin PIN)</label>
        </div>
        <label className="text-xs text-slate-500">PIN de supervisor<input type="text" value={d.supervisor_pin} onChange={e => set('supervisor_pin', e.target.value.replace(/\D/g, ''))} className="block w-40 border border-slate-300 rounded-lg px-3 py-2 text-base text-slate-900" /></label>
        <Btn onClick={save} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3"><Save size={18} />Guardar configuración</Btn>
      </Card>

      <div className="space-y-5">
        <Card className="p-5">
          <div className="font-bold text-slate-800 flex items-center gap-2 mb-2"><ShieldCheck size={20} />Respaldo de datos</div>
          <p className="text-sm text-slate-500 mb-3">Los datos viven en este navegador. Descargue un respaldo al final de cada día de la prueba piloto.</p>
          <div className="flex gap-2">
            <Btn onClick={backup} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5"><Download size={18} />Descargar respaldo</Btn>
            <label className="flex-1 inline-flex items-center justify-center gap-2 font-semibold rounded-lg bg-slate-800 hover:bg-slate-900 text-white py-2.5 cursor-pointer"><Upload size={18} />Restaurar<input type="file" accept="application/json" className="hidden" onChange={restore} /></label>
          </div>
        </Card>
        <Card className="p-5 border-red-200">
          <div className="font-bold text-red-700 flex items-center gap-2 mb-2"><Trash2 size={20} />Zona de peligro</div>
          <p className="text-sm text-slate-500 mb-3">Borra vehículos, historial, turnos y configuración. Descargue un respaldo antes.</p>
          <div className="flex gap-2"><input value={wipe} onChange={e => setWipe(e.target.value)} placeholder='Escriba BORRAR' className="flex-1 border border-slate-300 rounded-lg px-3 py-2" /><Btn onClick={wipeAll} className="bg-red-600 hover:bg-red-700 text-white px-4">Borrar todo</Btn></div>
        </Card>
      </div>
    </div>
  );
}

// =====================================================================
//  APP
// =====================================================================
function Clock_() {
  const [n, setN] = useState(Date.now());
  useEffect(() => { const i = setInterval(() => setN(Date.now()), 1000); return () => clearInterval(i); }, []);
  return <div className="text-right"><div className="flex items-center gap-2 text-2xl font-mono font-bold"><Clock size={20} className="text-amber-400" />{fmtTime(n)}</div><div className="text-xs text-slate-300">{fmtDate(n)}</div></div>;
}

function App() {
  const [cfg, setCfg] = useLS(KEYS.config, DEFAULT_CONFIG);
  const [vehicles, setVehicles] = useLS(KEYS.vehicles, []);
  const [history, setHistory] = useLS(KEYS.history, []);
  const [shifts, setShifts] = useLS(KEYS.shifts, []);
  const [counters, setCounters] = useLS(KEYS.counters, { moto: 0, carro: 0 });
  const [tab, setTab] = useState('entrada');
  const [now, setNow] = useState(Date.now());
  const [toasts, setToasts] = useState([]);
  const [printDoc, setPrintDoc] = useState(null);
  const [unlockUntil, setUnlockUntil] = useState(0);
  const [online, setOnline] = useState(navigator.onLine);

  useEffect(() => { const i = setInterval(() => setNow(Date.now()), 15000); return () => clearInterval(i); }, []);
  useEffect(() => {
    const on = () => setOnline(true), off = () => setOnline(false);
    window.addEventListener('online', on); window.addEventListener('offline', off);
    return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, []);

  const toast = (msg, kind = 'ok') => {
    const id = Math.random();
    setToasts(t => [...t.slice(-3), { id, msg, kind }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4500);
  };
  const doPrint = doc => { setPrintDoc(doc); setTimeout(() => { try { window.print(); } catch (e) { toast('No se pudo abrir la impresión', 'err'); } }, 400); };
  const unlocked = Date.now() < unlockUntil || !cfg.blind_mode;
  const tryUnlock = pin => {
    if (String(pin) === String(cfg.supervisor_pin)) { setUnlockUntil(Date.now() + 5 * 60000); setNow(Date.now()); toast('Modo supervisor activo por 5 minutos', 'info'); return true; }
    toast('PIN incorrecto', 'err'); return false;
  };
  const askPin = () => { const p = prompt('PIN de supervisor:'); if (p !== null) tryUnlock(p); };

  const shift = shifts.find(s => s.status === 'abierto') || null;
  const st = shift ? statsFor(shift.shift_id, history) : null;
  const occ = { moto: vehicles.filter(v => v.vehicle_type === 'moto').length, carro: vehicles.filter(v => v.vehicle_type === 'carro').length };
  const tabs = [['entrada', 'Entrada Rápida', Ticket], ['salida', 'Salida y Cobro', LogOut], ['turno', 'Turno y Arqueo', Wallet], ['auditoria', 'Auditoría e Historial', Activity], ['config', 'Configuración', Settings]];

  const kpi = (Ic, label, val, sub, color = 'text-indigo-600') => (
    <div className="bg-white rounded-xl shadow-sm border border-slate-200 px-4 py-3 flex items-center gap-3">
      <div className={`p-2 rounded-lg bg-slate-100 ${color}`}><Ic size={22} /></div>
      <div className="min-w-0"><div className="text-xs text-slate-500">{label}</div><div className="text-xl font-black text-slate-900 truncate">{val}</div>{sub && <div className="text-[11px] text-slate-400">{sub}</div>}</div>
    </div>);

  return (
    <>
      <div id="app-root" className="min-h-screen">
        <Toasts list={toasts} close={id => setToasts(t => t.filter(x => x.id !== id))} />
        <header className="bg-slate-900 text-white shadow-lg">
          <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h1 className="text-lg sm:text-2xl font-bold">Parque Fabricato | Sistema de Control de Parqueadero</h1>
              <div className="flex flex-wrap gap-2 mt-1.5 text-xs font-semibold">
                <span className="bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded-full">🟢 Operación Local / Offline Ready</span>
                <span className={`px-2 py-1 rounded-full ${online ? 'bg-indigo-500/30 text-indigo-200' : 'bg-amber-500/20 text-amber-300'}`} title="La sincronización con la nube es una demostración: no hay servidor conectado">
                  {online ? '☁️ Sincronización Cloud Activa' : '⚠️ Sin internet — guardando solo en local'}</span>
                {cfg.blind_mode && unlocked && <button onClick={() => setUnlockUntil(0)} className="bg-amber-500/20 text-amber-300 px-2 py-1 rounded-full flex items-center gap-1"><Unlock size={12} />Supervisor activo · bloquear</button>}
              </div>
            </div>
            <Clock_ />
          </div>
          <div className="max-w-7xl mx-auto px-4 pb-3 text-xs text-slate-400">{cfg.establishment_name} · Cajero: {cfg.cashier_name} · {shift ? <span className="text-emerald-400">Turno abierto desde {fmtTime(shift.open_time)}</span> : <span className="text-amber-400">Sin turno abierto</span>}</div>
          <nav className="bg-slate-950">
            <div className="max-w-7xl mx-auto px-2 flex overflow-x-auto">
              {tabs.map(([k, l, Ic]) => (
                <button key={k} onClick={() => setTab(k)} className={`flex items-center gap-2 px-4 py-3 text-sm font-semibold whitespace-nowrap border-b-4 transition ${tab === k ? 'border-emerald-400 text-white' : 'border-transparent text-slate-400 hover:text-white'}`}><Ic size={16} />{l}</button>
              ))}
            </div>
          </nav>
        </header>

        <main className="max-w-7xl mx-auto px-4 py-5 space-y-5">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            {kpi(Bike, 'Cupos disponibles Motos', `${cfg.cap_moto - occ.moto}`, `${occ.moto} ocupados de ${cfg.cap_moto}`, 'text-emerald-600')}
            {kpi(Car, 'Cupos disponibles Carros', `${cfg.cap_carro - occ.carro}`, `${occ.carro} ocupados de ${cfg.cap_carro}`, 'text-emerald-600')}
            {kpi(Users, 'Vehículos dentro', `${vehicles.length}`, 'en patio ahora')}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 px-4 py-3 flex items-center gap-3">
              <div className="p-2 rounded-lg bg-slate-100 text-amber-600"><Banknote size={22} /></div>
              <div className="min-w-0 flex-1"><div className="text-xs text-slate-500">Recaudo acumulado del turno</div>
                {!shift ? <div className="text-xl font-black text-slate-400">Sin turno</div>
                  : unlocked ? <div className="text-xl font-black text-slate-900 truncate">{money(st.total)}</div>
                  : <div className="flex items-center gap-2"><span className="text-xl font-black text-slate-400 tracking-widest">$ ••••</span><button onClick={askPin} className="text-xs text-indigo-600 flex items-center gap-1"><Eye size={12} />Ver</button></div>}
                <div className="text-[11px] text-slate-400">{shift ? `${st.count} cobros` : 'Abra turno para cobrar'}{cfg.blind_mode && !unlocked ? ' · modo ciego' : ''}</div></div>
            </div>
          </div>

          {tab === 'entrada' && <Entry cfg={cfg} vehicles={vehicles} setVehicles={setVehicles} counters={counters} setCounters={setCounters} toast={toast} doPrint={doPrint} occ={occ} />}
          {tab === 'salida' && <Exit cfg={cfg} vehicles={vehicles} setVehicles={setVehicles} setHistory={setHistory} shift={shift} toast={toast} doPrint={doPrint} goTab={setTab} />}
          {tab === 'turno' && <Shift cfg={cfg} shift={shift} shifts={shifts} setShifts={setShifts} history={history} vehicles={vehicles} toast={toast} doPrint={doPrint} />}
          {tab === 'auditoria' && <Audit cfg={cfg} vehicles={vehicles} history={history} shifts={shifts} unlocked={unlocked} tryUnlock={tryUnlock} now={now} toast={toast} doPrint={doPrint} />}
          {tab === 'config' && <PinGate unlocked={Date.now() < unlockUntil} tryUnlock={tryUnlock} title="Configuración (supervisor)"><Config cfg={cfg} setCfg={setCfg} toast={toast} /></PinGate>}
        </main>
      </div>
      <PrintArea doc={printDoc} cfg={cfg} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
